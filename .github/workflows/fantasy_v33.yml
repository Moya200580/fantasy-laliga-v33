name: Fantasy LaLiga V3.3
on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"
jobs:
  fantasy-laliga:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests numpy tweepy

      - name: Ejecutar actualización y V3.3
        run: |
          python src/actualizar_y_ejecutar_v3_3.py

      - name: Generar post variado según el día
        run: |
          python src/generar_post_variado.py

      - name: Comprobar post generado
        run: |
          test -f datos/post_diario_v3_3.txt
          echo "========================================"
          echo "POST DIARIO V3.3 GENERADO"
          echo "========================================"
          cat datos/post_diario_v3_3.txt

      - name: Guardar post como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: post-diario-v3-3
          path: datos/post_diario_v3_3.txt
          retention-days: 30

      - name: Publicar en X
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: |
          python src/publicar_en_x.py

      - name: Enviar post por correo
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          cat > /tmp/enviar_correo.py <<'PY'
          import os
          import smtplib
          from email.message import EmailMessage

          gmail = os.environ["GMAIL_ADDRESS"].strip()
          password = os.environ["GMAIL_APP_PASSWORD"].strip()

          with open("datos/post_diario_v3_3.txt", "r", encoding="utf-8") as f:
              post = f.read().strip()

          if not post:
              raise RuntimeError("El post diario está vacío")

          msg = EmailMessage()
          msg["Subject"] = "Fantasy LaLiga V3.3 - Post diario (ya publicado en X)"
          msg["From"] = gmail
          msg["To"] = "daviddelamoyagarcia@gmail.com"
          msg.set_content(
              "POST DIARIO V3.3 (ya publicado automáticamente en X)\n"
              "================\n\n"
              + post
          )

          with smtplib.SMTP("smtp.gmail.com", 587) as server:
              server.set_debuglevel(1)
              server.starttls()
              server.login(gmail, password)
              server.send_message(msg)
          PY
          python /tmp/enviar_correo.py
