name: Fantasy LaLiga V3.3

on:
  workflow_dispatch:

  schedule:
    - cron: "0 8 * * *"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests numpy tweepy

      - name: Ejecutar actualización y V3.3
        run: |
          python src/actualizar_y_ejecutar_v3_3.py

      - name: Comprobar post generado
        run: |
          test -f datos/post_diario_v3_3.txt
          echo "Post encontrado:"
          cat datos/post_diario_v3_3.txt

      - name: Publicar post en X
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_KEY_SECRET: ${{ secrets.X_API_KEY_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: |
          python - <<'PY'
          import os
          import tweepy

          with open("datos/post_diario_v3_3.txt", "r", encoding="utf-8") as f:
              text = f.read().strip()

          if not text:
              raise RuntimeError("El post está vacío")

          auth = tweepy.OAuth1UserHandler(
              os.environ["X_API_KEY"],
              os.environ["X_API_KEY_SECRET"],
              os.environ["X_ACCESS_TOKEN"],
              os.environ["X_ACCESS_TOKEN_SECRET"]
          )

          api = tweepy.API(auth)

          api.verify_credentials()

          client = tweepy.Client(
              consumer_key=os.environ["X_API_KEY"],
              consumer_secret=os.environ["X_API_KEY_SECRET"],
              access_token=os.environ["X_ACCESS_TOKEN"],
              access_token_secret=os.environ["X_ACCESS_TOKEN_SECRET"]
          )

          response = client.create_tweet(text=text)

          print("Publicado correctamente en X")
          print(response.data)
          PY
