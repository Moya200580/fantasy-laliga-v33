name: Fantasy LaLiga V3.3

on:
  workflow_dispatch:

  schedule:
    - cron: "0 8 * * *"

jobs:
  fantasy-laliga:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests numpy

      - name: Ejecutar actualización y V3.3
        run: |
          python src/actualizar_y_ejecutar_v3_3.py

      - name: Comprobar post generado
        run: |
          test -f datos/post_diario_v3_3.txt
          echo "========================================"
          echo "POST DIARIO V3.3 GENERADO CORRECTAMENTE"
          echo "========================================"
          cat datos/post_diario_v3_3.txt

      - name: Guardar post diario
        uses: actions/upload-artifact@v4
        with:
          name: post-diario-v3-3
          path: datos/post_diario_v3_3.txt
          retention-days: 30
